name: User Service CI/CD

on:
  push:
    branches:
      - learn

  pull_request:
    branches:
      - learn

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================
  # Stage 1: Unit Test
  # ============================================================
  unit-test:
    name: "Stage 1: Unit Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: mvn -B test


  # ============================================================
  # Stage 2: Build & Artifact
  # ============================================================
  build:
    name: "Stage 2: Build & Artifact"
    needs: unit-test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/learn'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    outputs:
      commit_id: ${{ steps.vars.outputs.commit_id }}
      artifact_name: ${{ steps.vars.outputs.artifact_name }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate commit ID
        id: vars
        run: |
          COMMIT_ID="${GITHUB_SHA:0:7}"

          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=user-service-$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build application
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: |
          docker build \
            -t user-service:${{ steps.vars.outputs.commit_id }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            user-service:${{ steps.vars.outputs.commit_id }} \
            -o ${{ steps.vars.outputs.artifact_name }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ steps.vars.outputs.artifact_name }}.tar
          retention-days: 14


  # ============================================================
  # Stage 3: Deploy
  # ============================================================
  deploy:
    name: "Stage 3: Deploy"
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/learn'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: production

    permissions:
      actions: read

    env:
      COMMIT_ID: ${{ needs.build.outputs.commit_id }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}

      IMAGE_NAME: user-service

      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      HOST_PORT: ${{ vars.HOST_PORT }}
      CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}

      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:

      # ==========================================================
      # Download Docker artifact
      # ==========================================================
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .

      # ==========================================================
      # Validate configuration
      # ==========================================================
      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST is not configured."
            exit 1
          fi

          if [ -z "$SERVER_USER" ]; then
            echo "ERROR: SERVER_USER is not configured."
            exit 1
          fi

          if [ -z "$CONTAINER_NAME" ]; then
            echo "ERROR: CONTAINER_NAME is not configured."
            exit 1
          fi

          if [ -z "$HOST_PORT" ]; then
            echo "ERROR: HOST_PORT is not configured."
            exit 1
          fi

          if [ -z "$CONTAINER_PORT" ]; then
            echo "ERROR: CONTAINER_PORT is not configured."
            exit 1
          fi

          echo "Container : $CONTAINER_NAME"
          echo "Port      : $HOST_PORT:$CONTAINER_PORT"
          echo "Image     : $IMAGE_NAME:$COMMIT_ID"

      # ==========================================================
      # Configure SSH
      # ==========================================================
      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # ==========================================================
      # Test SSH connection
      # ==========================================================
      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'SSH connection successful'"

      # ==========================================================
      # Copy Docker image to server
      # ==========================================================
      - name: Copy Docker image to server
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            "${ARTIFACT_NAME}.tar" \
            "$SERVER_USER@$SERVER_HOST:/tmp/${ARTIFACT_NAME}.tar"

      # ==========================================================
      # Deploy Docker container
      # ==========================================================
      - name: Deploy container
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s << EOF

          set -euo pipefail

          IMAGE_NAME="$IMAGE_NAME"
          COMMIT_ID="$COMMIT_ID"
          CONTAINER_NAME="$CONTAINER_NAME"
          HOST_PORT="$HOST_PORT"
          CONTAINER_PORT="$CONTAINER_PORT"
          ARTIFACT_NAME="$ARTIFACT_NAME"

          echo "=========================================="
          echo "Starting deployment"
          echo "=========================================="

          echo "Image     : \$IMAGE_NAME:\$COMMIT_ID"
          echo "Container : \$CONTAINER_NAME"
          echo "Port      : \$HOST_PORT:\$CONTAINER_PORT"

          # ------------------------------------------------------
          # Load Docker image
          # ------------------------------------------------------
          echo "Loading Docker image..."

          docker load -i "/tmp/\${ARTIFACT_NAME}.tar"

          # ------------------------------------------------------
          # Verify image
          # ------------------------------------------------------
          docker image inspect "\$IMAGE_NAME:\$COMMIT_ID" > /dev/null

          echo "Docker image loaded successfully."

          # ------------------------------------------------------
          # Get previous image
          # ------------------------------------------------------
          echo "Checking previous container..."

          PREVIOUS_IMAGE=\$(docker inspect \
            --format='{{.Config.Image}}' \
            "\$CONTAINER_NAME" 2>/dev/null || echo "")

          echo "Previous image: \$PREVIOUS_IMAGE"

          # ------------------------------------------------------
          # Stop existing container
          # ------------------------------------------------------
          docker stop "\$CONTAINER_NAME" 2>/dev/null || true
          docker rm "\$CONTAINER_NAME" 2>/dev/null || true

          # ------------------------------------------------------
          # Start new container
          # ------------------------------------------------------
          echo "Starting new container..."

          docker run -d \
            --name "\$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "\$HOST_PORT:\$CONTAINER_PORT" \
            "\$IMAGE_NAME:\$COMMIT_ID"

          # ------------------------------------------------------
          # Health check
          # ------------------------------------------------------
          echo "Waiting for application..."

          for i in \$(seq 1 10); do

            echo "Health check attempt \$i..."

            if curl -sf "http://localhost:\$HOST_PORT/users" > /dev/null; then

              echo "=========================================="
              echo "Deployment successful."
              echo "=========================================="

              exit 0

            fi

            sleep 3

          done

          # ------------------------------------------------------
          # Deployment failed
          # ------------------------------------------------------
          echo "Health check failed."

          echo "Container logs:"
          docker logs "\$CONTAINER_NAME" --tail 50 || true

          echo "Starting rollback..."

          docker stop "\$CONTAINER_NAME" 2>/dev/null || true
          docker rm "\$CONTAINER_NAME" 2>/dev/null || true

          # ------------------------------------------------------
          # Rollback
          # ------------------------------------------------------
          if [ -n "\$PREVIOUS_IMAGE" ]; then

            echo "Rolling back to \$PREVIOUS_IMAGE"

            docker run -d \
              --name "\$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "\$HOST_PORT:\$CONTAINER_PORT" \
              "\$PREVIOUS_IMAGE"

            echo "Rollback completed."

          else

            echo "No previous image available for rollback."

          fi

          exit 1

          EOF

      # ==========================================================
      # Remove artifact from server
      # ==========================================================
      - name: Remove artifact from server
        if: always()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "rm -f /tmp/${ARTIFACT_NAME}.tar" || true

      # ==========================================================
      # Cleanup SSH key
      # ==========================================================
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
